services:
  postgres:
    image: postgres:16-alpine
    container_name: datapilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapilot} -d ${POSTGRES_DB:-datapilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datapilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: datapilot-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID before running compose}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY before running compose}
    # Not published; use `docker compose exec` or a dedicated admin network for the console.
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: datapilot-ollama
    profiles: ["local-llm"]
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Shared configuration for the API, worker and migration containers.
  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: datapilot-backend:local
    environment: &backend-env
      APP_ENV: ${APP_ENV:-production}
      APP_RELEASE: ${APP_RELEASE:-}
      DEBUG: ${DEBUG:-false}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Only the nginx container (on the compose network) may set X-Forwarded-For.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datapilot}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      JOB_EXECUTION_MODE: worker
      # Crashed-worker recovery window (heartbeat every 15 s); keep well above the heartbeat.
      JOB_VISIBILITY_TIMEOUT_SECONDS: ${JOB_VISIBILITY_TIMEOUT_SECONDS:-90}
      RATE_LIMITER_BACKEND: ${RATE_LIMITER_BACKEND:-redis}
      RATE_LIMITER_FAIL_OPEN: "false"
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-1}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_BUCKET: ${S3_BUCKET:-datapilot-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID before running compose}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY before running compose}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-2}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-5}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-2}
      S3_CIRCUIT_SECONDS: ${S3_CIRCUIT_SECONDS:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      DATASET_CACHE_MAX_BYTES: ${DATASET_CACHE_MAX_BYTES:-536870912}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before running compose}
      # Must be persistent: stored user API keys are unreadable if it changes.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (Fernet key) before running compose}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS before running compose}
      AUTH_ALLOWED_REDIRECT_ORIGINS: ${AUTH_ALLOWED_REDIRECT_ORIGINS:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER (gemini|openai|claude|ollama) before running compose}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-models/gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
      STRIPE_BILLING_ENABLED: ${STRIPE_BILLING_ENABLED:-true}
      STRIPE_ENVIRONMENT: ${STRIPE_ENVIRONMENT:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_ANNUAL: ${STRIPE_PRICE_PRO_ANNUAL:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_ANNUAL: ${STRIPE_PRICE_TEAM_ANNUAL:-}
      PHONE_OTP_ENABLED: ${PHONE_OTP_ENABLED:-false}
      PHONE_OTP_DEV_MODE: "false"
      SMS_OTP_WEBHOOK_URL: ${SMS_OTP_WEBHOOK_URL:-}
      SMS_OTP_WEBHOOK_TOKEN: ${SMS_OTP_WEBHOOK_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST (password-reset/verification email) before running compose}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # Public HTTPS URL of the web app: used in verification / password-reset links.
      # Startup fails in production when it is missing, not https, or points at localhost.
      APP_URL: ${APP_URL:?Set APP_URL (public https URL of the web app) before running compose}
      FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: json
    # Not published: the API is reachable only through the frontend nginx (/api).
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # One-shot schema migration; API and workers start only after it succeeds.
  migrate:
    <<: *backend
    container_name: datapilot-migrate
    command: ["sh", "-c", "python -m alembic upgrade head"]
    expose: []
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  # Durable background jobs (ingest, exports, reports, forecasts, cleanup).
  # Scale horizontally with `docker compose up --scale worker=N`.
  worker:
    <<: *backend
    command: ["sh", "-c", "python scripts/validate_env.py && exec python worker.py"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
    expose:
      - "9100"
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:?Set VITE_PUBLIC_SITE_URL before running compose}
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: datapilot-frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
