# nginx for the single-container Hugging Face deployment. Mirrors
# frontend/nginx.conf, but runs as a non-root user, listens on 7860 and proxies
# to uvicorn on localhost.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  # Hugging Face's proxy appends the client IP to X-Forwarded-For. Without
  # real_ip_recursive, nginx takes the last entry (the one HF added), so
  # per-user rate limits work instead of every tester sharing HF's proxy IP.
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Forwarded-For;

  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 7860;
    server_name _;
    root /app/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.razorpay.com; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://checkout.stripe.com https://*.razorpay.com; form-action 'self' https://checkout.stripe.com https://api.razorpay.com; upgrade-insecure-requests" always;

    client_max_body_size 55m;

    location /api/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 180s;
      proxy_request_buffering on;
    }

    location = /api/chat/stream {
      proxy_pass http://127.0.0.1:8000/chat/stream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 120s;
    }

    location = /api/metrics { return 404; }

    location = /sw.js {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
      expires 1y;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }
  }
}
