name: Production Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend Tests And Security (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: datapilot
          POSTGRES_DB: datapilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      JWT_SECRET: ci-jwt-secret-1234567890-1234567890
      RATE_LIMITER_BACKEND: memory
      STORAGE_PROVIDER: local
      STRIPE_BILLING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Select database
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            echo "DATABASE_URL=postgresql+psycopg2://datapilot:datapilot@localhost:5432/datapilot_test" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=sqlite:///./ci_datapilot.db" >> "$GITHUB_ENV"
          fi
      - name: Validate production env gate
        env:
          APP_ENV: production
          JWT_SECRET: ci-jwt-secret-1234567890-1234567890
          DATABASE_URL: postgresql+psycopg2://datapilot:password@postgres:5432/datapilot
          ALLOWED_ORIGINS: https://app.datapilot.example
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: placeholder
          ENCRYPTION_KEY: ci-placeholder-encryption-key-0123456789abcdef
          JOB_EXECUTION_MODE: worker
          SMTP_HOST: smtp.example.internal
          STRIPE_BILLING_ENABLED: "false"
          RATE_LIMITER_BACKEND: redis
          REDIS_URL: redis://redis:6379/0
          STORAGE_PROVIDER: s3
          S3_BUCKET: datapilot-ci
        run: python scripts/validate_env.py
      - name: Compile Python
        run: python -m compileall -q main.py worker.py core agents scripts alembic
      - name: Migration upgrade / downgrade / upgrade
        run: python -m alembic upgrade head && python -m alembic downgrade -1 && python -m alembic upgrade head
      - name: Backend tests
        run: python -m pytest -q
      - name: pip-audit
        if: matrix.database == 'sqlite'
        run: python -m pip install -r requirements-security.txt && pip-audit -r requirements.txt --strict

  frontend:
    name: Frontend Tests And Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (rules of hooks)
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Build production bundle
        env:
          VITE_API_URL: /api
          VITE_PUBLIC_SITE_URL: https://app.datapilot.example
        run: npm run build
      - name: Scan production bundle for loopback API origins
        run: npm run test:prod-api-bundle
      - name: npm audit (shipped runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (build tooling, informational)
        run: npm audit --audit-level=high || true

  containers:
    name: Containers And Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Backend image build
        run: docker build -t datapilot-backend:ci backend
      - name: Frontend image build
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_PUBLIC_SITE_URL=https://app.datapilot.example -t datapilot-frontend:ci frontend
      - name: Compose config validation
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-1234567890-1234567890
          ENCRYPTION_KEY: ci-placeholder-encryption-key
          LLM_PROVIDER: gemini
          SMTP_HOST: smtp.example.internal
          ALLOWED_ORIGINS: https://app.datapilot.example
          VITE_PUBLIC_SITE_URL: https://app.datapilot.example
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin123
        run: docker compose config

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}