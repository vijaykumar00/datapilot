name: Production Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend Tests And Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      JWT_SECRET: ci-jwt-secret-1234567890-1234567890
      DATABASE_URL: sqlite:///./ci_datapilot.db
      RATE_LIMITER_BACKEND: memory
      STORAGE_PROVIDER: local
      STRIPE_BILLING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate production env gate
        env:
          APP_ENV: production
          JWT_SECRET: ci-jwt-secret-1234567890-1234567890
          DATABASE_URL: postgresql+psycopg2://datapilot:password@postgres:5432/datapilot
          ALLOWED_ORIGINS: https://app.datapilot.example
          AI_PROVIDER: gemini
          GEMINI_API_KEY: placeholder
          STRIPE_BILLING_ENABLED: "false"
          RATE_LIMITER_BACKEND: redis
          REDIS_URL: redis://redis:6379/0
          STORAGE_PROVIDER: s3
          S3_BUCKET: datapilot-ci
        run: python scripts/validate_env.py
      - name: Compile Python
        run: python -m compileall main.py core agents scripts
      - name: Migration upgrade smoke
        run: python -m alembic upgrade head
      - name: Backend tests
        run: python -m pytest -q
      - name: pip-audit
        run: python -m pip install -r requirements-security.txt && pip-audit -r requirements.txt --strict

  frontend:
    name: Frontend Tests And Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Build production bundle
        env:
          VITE_API_URL: /api
          VITE_PUBLIC_SITE_URL: https://app.datapilot.example
        run: npm run build
      - name: Scan production bundle for loopback API origins
        run: npm run test:prod-api-bundle
      - name: npm audit
        run: npm audit --audit-level=high

  containers:
    name: Containers And Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Backend image build
        run: docker build -t datapilot-backend:ci backend
      - name: Frontend image build
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_PUBLIC_SITE_URL=https://app.datapilot.example -t datapilot-frontend:ci frontend
      - name: Compose config validation
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-1234567890-1234567890
          ENCRYPTION_KEY: ""
          ALLOWED_ORIGINS: https://app.datapilot.example
          VITE_PUBLIC_SITE_URL: https://app.datapilot.example
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin123
        run: docker compose config

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
